<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Baby Shower de Victoria Barón Serna - Sábado 5 de Diciembre</title>
  
  <meta property="og:type" content="website">
  <meta property="og:title" content="¡Baby Shower de Victoria Barón Serna!">
  <meta property="og:description" content="Sábado 5 de diciembre · 4:00 PM · Conjunto Residencial Torre 44, Montería. ¡Acompáñanos a celebrar la dulce espera!">
  <meta property="og:image" content="https://vbaronmestra-crypto.github.io/Victoria-BabyShower/portada.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="1200">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Great+Vibes&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --primary-pink: #f7d6dc;
      --deep-pink: #d97d91;
      --soft-rose: #fbf5f4;
      --gold: #d4af37;
      --sage-green: #90a48a;
      --text-dark: #4a3e3d;
      --text-muted: #7d706f;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: 'Montserrat', sans-serif;
      background: radial-gradient(circle at center, #fff6f8 0%, #faedf0 100%);
      color: var(--text-dark);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 16px;
    }

    .main-wrapper {
      width: 100%;
      max-width: 440px;
      perspective: 1200px;
      position: relative;
    }

    /* SOBRE INTERACTIVO */
    .envelope-screen {
      background: #ffffff;
      border-radius: 20px;
      box-shadow: 0 16px 36px rgba(217, 125, 145, 0.18);
      padding: 36px 24px;
      text-align: center;
      border: 1px solid rgba(217, 125, 145, 0.2);
    }

    .monogram-badge {
      width: 82px;
      height: 82px;
      margin: 0 auto 20px;
      border-radius: 50%;
      background: linear-gradient(135deg, #fceda2 0%, var(--gold) 50%, #997415 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Great Vibes', cursive;
      font-size: 46px;
      color: #ffffff;
      box-shadow: 0 8px 20px rgba(212, 175, 55, 0.35);
      cursor: pointer;
      animation: pulse 1.8s infinite ease-in-out;
      border: 3px solid #ffffff;
    }

    @keyframes pulse {
      0% { transform: scale(1); box-shadow: 0 8px 20px rgba(212, 175, 55, 0.35); }
      50% { transform: scale(1.06); box-shadow: 0 12px 28px rgba(212, 175, 55, 0.5); }
      100% { transform: scale(1); box-shadow: 0 8px 20px rgba(212, 175, 55, 0.35); }
    }

    .guest-tag {
      font-size: 13px;
      letter-spacing: 2.5px;
      text-transform: uppercase;
      color: var(--deep-pink);
      font-weight: 600;
      margin-bottom: 6px;
    }

    .guest-name-envelope {
      font-family: 'Cormorant Garamond', serif;
      font-size: 26px;
      font-weight: 600;
      color: var(--text-dark);
      margin-bottom: 14px;
    }

    .envelope-subtitle {
      font-size: 14px;
      color: var(--text-muted);
      line-height: 1.5;
      margin-bottom: 24px;
    }

    .btn-open {
      background: linear-gradient(135deg, #e3899d 0%, #c86b80 100%);
      color: #ffffff;
      border: none;
      padding: 14px 32px;
      border-radius: 30px;
      font-size: 15px;
      font-weight: 500;
      letter-spacing: 1px;
      cursor: pointer;
      box-shadow: 0 6px 18px rgba(217, 125, 145, 0.35);
    }

    .btn-open:active {
      transform: scale(0.98);
    }

    .invitation-card {
      display: none;
      background: #ffffff;
      border-radius: 24px;
      overflow: hidden;
      box-shadow: 0 20px 45px rgba(180, 120, 135, 0.2);
      border: 1px solid rgba(247, 214, 220, 0.6);
      position: relative;
    }

    .music-floating-btn {
      position: absolute;
      top: 18px;
      right: 18px;
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: #ffffff;
      border: 1px solid var(--primary-pink);
      box-shadow: 0 4px 12px rgba(217, 125, 145, 0.25);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      cursor: pointer;
      z-index: 10;
    }

    .music-floating-btn.playing {
      animation: rotateMusic 2.8s linear infinite;
    }

    @keyframes rotateMusic {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    .hero-banner {
      background: linear-gradient(180deg, #fef4f6 0%, #ffffff 100%);
      padding: 30px 20px 10px;
      text-align: center;
      position: relative;
    }

    .floral-top {
      font-size: 22px;
      letter-spacing: 6px;
      color: var(--deep-pink);
      opacity: 0.6;
      margin-bottom: 6px;
    }

    .welcome-text {
      font-family: 'Cormorant Garamond', serif;
      font-size: 16px;
      font-style: italic;
      color: var(--text-muted);
    }

    .baby-title {
      font-family: 'Great Vibes', cursive;
      font-size: 46px;
      color: var(--deep-pink);
      line-height: 1.15;
      margin: 4px 0 12px;
    }

    .bunny-img-container {
      width: 220px;
      height: 220px;
      margin: 0 auto;
      border-radius: 50%;
      background: #fffafb;
      box-shadow: inset 0 0 15px rgba(217, 125, 145, 0.15), 0 8px 24px rgba(217, 125, 145, 0.18);
      border: 4px solid #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .bunny-img-container img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform-origin: 50% 90%;
      animation: bunnyLivelyDance 1.6s ease-in-out infinite alternate;
    }

    @keyframes bunnyLivelyDance {
      0% { transform: rotate(-5deg) translateY(0px) scale(1); }
      25% { transform: rotate(0deg) translateY(-8px) scale(1.04); }
      50% { transform: rotate(5deg) translateY(0px) scale(1); }
      75% { transform: rotate(0deg) translateY(-6px) scale(1.03); }
      100% { transform: rotate(-5deg) translateY(0px) scale(1); }
    }
