    .main-wrapper {

    .envelope-screen {

      pointer-events: none;
      display: none;
    }

      animation: pulse 1.8s infinite ease-in-out;
      border: 3px solid #ffffff;

    @keyframes pulse {
      0% { transform: scale(1); box-shadow: 0 8px 20px rgba(212, 175, 55, 0.35); }

    }

      font-weight: 600;
      margin-bottom: 6px;

    .guest-name-envelope {
      font-family: 'Cormorant Garamond', serif;
      font-size: 26px;
      font-weight: 600;
      color: var(--text-dark);
      margin-bottom: 14px;
    }

    .envelope-subtitle {
      font-size: 14px;
      color: var(--text-muted);
      line-height: 1.5;
      margin-bottom: 24px;

      color: #ffffff;
      border: none;
      padding: 14px 32px;

      font-weight: 500;
      letter-spacing: 1px;
      cursor: pointer;
      box-shadow: 0 6px 18px rgba(217, 125, 145, 0.35);
      transition: transform 0.2s;
    }

    .btn-open:active {
      transform: scale(0.98);
    }

    .invitation-card {
      display: none;
      background: #ffffff;
      border-radius: 24px;
      overflow: hidden;

      animation: fadeInCard 0.9s ease-out forwards;
      position: relative;
    }

    .invitation-card.active {
      display: block;
    }

      to { opacity: 1; transform: translateY(0); }
    }
